- id: forty-six
  name: Forty-Six
  roaster: Counter Culture Coffee
  roastedIn: { name: Durham NC, lat: 35.99, lon: -78.90 }
  flavors: [Dark chocolate, Sweet, Full-bodied]
  take: >-
    Counter Culture's darkest roast, and not a subtle one: smoke and dark chocolate with a heavy body. That's the
    point. It's the bag I reach for when the drink is mostly milk and the coffee still has to be heard.
  source: https://counterculturecoffee.com/products/12-oz-forty-six
  origins:
    - id: uganda-mt-elgon
      label: Mt. Elgon, Uganda · 70%
      place: Mt. Elgon, Uganda
      note: >-
        Counter Culture changes the recipe every few weeks and publishes each one by roast date. This is the mix for
        bags roasted January 7 to February 26, 2026, when this one was.
      lat: 1.15
      lon: 34.45
      altitude: 1800
      precision: region
    - id: ethiopia-forty-six
      label: Ethiopia · 30% (Jabanto natural 20%, Malabu 10%)
      place: Southern Ethiopia
      note: Two Ethiopian lots in the same recipe; shown for southern Ethiopia, not the washing stations.
      lat: 6.2
      lon: 38.5
      altitude: 1900
      precision: country

- id: hair-bender
  name: Hair Bender
  roaster: Stumptown Coffee Roasters
  roastedIn: { name: Portland OR, lat: 45.52, lon: -122.68 }
  flavors: [Citrus, Dark chocolate, Raisin]
  take: >-
    Stumptown's flagship, and busier than most espresso blends: a citrus edge on top of dark chocolate, with a raisin
    sweetness that shows up as it cools. Good straight, better as a cortado.
  source: https://www.stumptowncoffee.com/products/hair-bender
