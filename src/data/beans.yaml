# Beans I've been drinking, shown as cards and map pins on /coffee. Climate and flavor only (no market content).
# Facts come from the bag or the roaster's own pages (`source`); `take` is a short impression.
# A blend with no named farms can use `originsText` instead of `origins` (a card without a pin or climate card).
# `precision` says how exact the pin is: farm | region | country (shown on the card so it isn't overstated), or `area`
# for a broad sourcing area named without farms (`spread`: radius in degrees, drawn as a dashed circle, no climate card).
# After adding an origin, run `pnpm climate` to fetch its 1991–2020 climate normals into src/data/climate/.

- id: rosslyn-roasted-for-milk
  name: Roasted for Milk — Brazil
  roaster: Rosslyn Coffee
  roasterNote: roasted by Origin Coffee Roasters, Cornwall
  roastedIn: { name: London, lat: 51.51, lon: -0.09 }
  roastDate: 2026-11-05
  flavors: [Milk chocolate, Plum, Caramel]
  take: >-
    Picked up at Rosslyn on a trip to London. It's made to be drunk with milk, and it shows: chocolate and caramel
    come straight through a flat white, with a little plum sweetness and almost no sharpness. With a coffee this
    forgiving, any wobbly latte art is on me.
  origins:
    - id: brazil-sul-de-minas
      label: Brazil
      place: Sul de Minas, Brazil
      note: The bag names only the country; shown for Sul de Minas, Brazil's main arabica region.
      lat: -21.55
      lon: -45.43
      precision: country
      process: Pulped natural

- id: monmouth-espresso
  name: Monmouth Espresso
  roaster: Monmouth Coffee Company
  roastedIn: { name: London, lat: 51.50, lon: -0.08 }
  flavors: [Chocolate, Roasted nuts, Soft fruit]
  take: >-
    A London classic, and the bag I'd hand to anyone starting out with espresso. Guatemala's Las Nubes is the base,
    a Brazilian pulped natural adds cocoa, and a washed Huila from Colombia brings the high notes. Round, hard to get
    wrong, and happy with or without milk.
  source: https://www.monmouthcoffee.co.uk/product/blend-monmouth-espresso
  origins:
    - id: guatemala-las-nubes
      label: Las Nubes, Guatemala (base)
      place: Antigua, Guatemala
      note: Monmouth's recipe as of November 2026; the farms in the blend change through the year.
      lat: 14.56
      lon: -90.73
      precision: region
      process: Washed
    - id: brazil-carmo-de-minas
      label: Fazenda IP, Brazil
      place: Carmo de Minas, Minas Gerais, Brazil
      lat: -22.12
      lon: -45.13
      precision: region
      process: Pulped natural
    - id: colombia-huila
      label: Lo Mejor de Huila, Colombia
      place: Huila, Colombia
      lat: 1.86
      lon: -76.05
      altitude: 1700
      precision: region
      process: Washed

- id: winter-espresso
  name: Winter Espresso
  roaster: Square Mile Coffee Roasters
  source: https://shop.squaremilecoffee.com/collections/espresso-coffee
  roastedIn: { name: London, lat: 51.52, lon: -0.10 }
  roastDate: 2026-11-05
  flavors: [Blood orange, Date, Pistachio]
  take: >-
    From Square Mile, a name that carries real weight in London coffee, in a bag with a robin family baking on the
    label. Half honey-processed Ethiopian, half Guatemalan, so it's brighter than most espresso blends: citrus up
    front, a sticky dried-fruit middle, a nutty finish. Tastes like December.
  origins:
    - id: ethiopia-telila
      label: Telila, Ethiopia · 50%
      place: Kecho Anderacha, Jimma, Ethiopia
      lat: 7.77
      lon: 36.37
      precision: region
      process: Honey
      note: Components as of the November 2026 bags; Square Mile changes them through the year.
    - id: guatemala-huehuetenango
      label: El Anonal, Guatemala · 50%
      place: Huehuetenango, Guatemala
      note: Orlando and Gesler Martínez's farm; Square Mile names the department, not the town, so the pin marks Huehuetenango.
      lat: 15.32
      lon: -91.47
      precision: region
      process: Washed

- id: red-brick
  name: Red Brick
  roaster: Square Mile Coffee Roasters
  roastedIn: { name: London, lat: 51.52, lon: -0.10 }
  roastDate: 2026-11-05
  flavors: [Yellow plum, Butterscotch, Orange, Smooth]
  take: >-
    Square Mile's house espresso, and the sweet, easy-going sibling of the Winter blend: butterscotch and soft stone
    fruit with a clean orange finish. Nothing shouts. The one I'd pull for guests.
  source: https://shop.squaremilecoffee.com/products/red-brick
  origins:
    - id: ethiopia-telila
      label: Telila, Ethiopia · 47%
      place: Kecho Anderacha, Jimma, Ethiopia
      lat: 7.77
      lon: 36.37
      precision: region
      process: Washed
      note: Components as of the November 2026 bags; Square Mile changes them with the harvests.
    - id: costa-rica-tarrazu
      label: Tarrazú Blend, Costa Rica · 53%
      note: White honey lots from two neighbouring micromills, La Lía (Luis and Oscar Monge) and Don Oscar (Alejandro Jiménez).
      place: Tarrazú, Costa Rica
      lat: 9.66
      lon: -84.02
      precision: region
      process: White honey

- id: nomad-guatemala-primavera
  name: Espresso Guatemala Primavera
  roaster: Nomad Coffee
  roastedIn: { name: Barcelona, lat: 41.40, lon: 2.19 }
  roastDate: 2025-09-23
  flavors: [Milk chocolate, Hazelnut, Honey]
  take: >-
    A gift from a friend, carried home from a trip to Spain. Nomad roasts it lighter than most espresso, and it shows:
    milk chocolate and hazelnut first, a gentle apple-like brightness, then honey and raisin that linger. Juicy on its
    own, soft and sweet under milk. A taste of someone else's holiday.
  source: https://www.nomadcoffee.es/
  origins:
    - id: guatemala-huehuetenango
      label: Huehuetenango, Guatemala
      place: Huehuetenango, Guatemala
      note: From local producers; Caturra, Catuai and Bourbon. Shown for the department, not a farm.
      lat: 15.32
      lon: -91.47
      precision: region
      process: Washed

- id: common-man-cmcr-espresso
  name: CMCR Espresso
  roaster: Common Man Coffee Roasters
  roastedIn: { name: Singapore, lat: 1.29, lon: 103.85 }
  flavors: [Ripe cherry, Stone fruit, Milk chocolate]
  take: >-
    A friend brought this back from Singapore, from Common Man, one of the city's best-known specialty roasters. It's
    better than a house blend has any right to be: ripe cherry and stone fruit first, milk chocolate rounding it out,
    and a sweet, clean finish. Lively on its own, and it still comes through in a flat white.
  source: https://commonmancoffeeroasters.com/
  originsText: A house blend; the bag doesn't name its origins.

- id: taoca-kobe-blend
  name: Kobe Blend
  roaster: TAOCA COFFEE
  roastedIn: { name: Nishinomiya, lat: 34.74, lon: 135.34 }
  flavors: [Navel orange, Caramel, Walnut, Dark chocolate]
  take: >-
    A friend brought this back from Kobe this spring. It's TAOCA's Kobe-only dark roast: a natural Brazil as the
    base, with washed Ethiopian and Colombian coffees for sweetness. Dark chocolate and caramel up front, walnut in
    the middle, a soft navel-orange note behind. Rich enough to carry a latte, which is where it's been going.
  source: https://taocacoffee.net/items/6aa7b0968c2560e466771595
  origins:
    - id: brazil-sul-de-minas
      label: Acauã, Brazil (base)
      place: Minas Gerais, Brazil
      note: >-
        The recipe as TAOCA lists it in autumn 2026: three components, no shares; a spring bag may have differed.
        The page doesn't say where in Brazil Acauã is, so the pin sits in Sul de Minas, Brazil's main arabica region.
      lat: -21.55
      lon: -45.43
      precision: country
      process: Natural
    - id: ethiopia-yirgacheffe
      label: Yirgacheffe, Ethiopia
      place: Yirgacheffe, Ethiopia
      lat: 6.16
      lon: 38.2
      altitude: 1900
      precision: region
      process: Washed
    - id: colombia-narino
      label: Nariño, Colombia
      place: Nariño, Colombia
      lat: 1.2
      lon: -77.3
      altitude: 1900
      precision: region
      process: Washed

