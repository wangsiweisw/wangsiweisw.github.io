- id: nguyen-moxy
  name: Moxy
  roaster: Nguyen Coffee Supply
  roastedIn: { name: Brooklyn, lat: 40.68, lon: -73.94 }
  flavors: [Wild berries, Cherry, Honey, Chocolate]
  take: >-
    Grown in Vietnam, roasted in Brooklyn, and a reminder that Vietnam grows more than robusta. A medium roast with
    berries and cherry on top and honey and chocolate underneath. Friendly in milk, and a nice change from the usual
    Latin American base.
  source: https://www.nguyencoffeesupply.com/pages/about-us
  origins:
    - id: vietnam-da-lat
      label: Da Lat, Vietnam
      place: Da Lat, Lâm Đồng, Vietnam
      note: >-
        Nguyen's partner farm, run by fourth-generation farmer Mr. Ton, is in Da Lat in the Central Highlands; the
        exact plot isn't published, so the pin marks the town.
      lat: 11.94
      lon: 108.44
      altitude: 1500
      precision: region

- id: illy-classico
  name: Classico
  roaster: illy
  roastedIn: { name: Trieste, lat: 45.65, lon: 13.78 }
  flavors: [Caramel, Orange blossom, Jasmine]
  take: >-
    The red-and-silver tin everyone knows. Nitrogen-sealed, so every can tastes the same: caramel and a little
    chocolate, a soft floral lift, no sharp edges. Never the most exciting cup, never a wrong one, and very easy
    under milk.
  source: https://www.illy.com/en-us/shop/coffee/all-coffee/8842ST.html
  originsText: A blend of 100% Arabica from several origins; illy doesn't publish the mix.

- id: starbucks-reserve-whiskey-barrel-guatemala
  name: Whiskey Barrel-Aged Guatemala
  roaster: Starbucks Reserve Roastery
  roastedIn: { name: Seattle, lat: 47.61, lon: -122.33 }
  flavors: [Chocolate, Stone fruit, Oak]
  take: >-
    A friend carried this one home from the Seattle Roastery. The green coffee rested in Knob Creek bourbon barrels
    before roasting, and the barrel is the first thing you smell when the bag opens: warm, sweet oak. The cup is
    gentler than the smell promises, chocolate and soft stone fruit with the oak lingering behind. A fun novelty, best
    on its own, where milk can't bury the barrel.
  source: https://www.starbucksreserve.com/coffee/starbucks-reserve-r-knobcreek-r-bourbon-whiskey-barrel-aged-guatemala
  origins:
    - id: guatemala-central-highlands
      label: Guatemala
      place: Central highlands, Guatemala
      note: The bag names only the country; shown for the volcanic highlands west of Guatemala City.
      lat: 14.56
      lon: -90.73
      precision: country
