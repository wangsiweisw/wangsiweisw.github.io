# Beans I've been drinking, shown as cards and map pins on /coffee. Climate and flavor only (no market content).
# Facts come from the bag or the roaster's own pages (`source`); `take` is a short impression.
# A blend with no named farms can use `originsText` instead of `origins` (a card without a pin or climate card).
# `precision` says how exact the pin is: farm | region | country (shown on the card so it isn't overstated), or `area`
# for a broad sourcing area named without farms (`spread`: radius in degrees, drawn as a dashed circle, no climate card).
# After adding an origin, run `pnpm climate` to fetch its 1991–2020 climate normals into src/data/climate/.

- id: rosslyn-roasted-for-milk
  name: Roasted for Milk — Brazil
  roaster: Rosslyn Coffee
  roasterNote: roasted by Origin Coffee Roasters, Cornwall
  roastedIn: { name: London, lat: 51.51, lon: -0.09 }
  roastDate: 2026-11-05
  flavors: [Milk chocolate, Plum, Caramel]
  take: >-
    Picked up at Rosslyn on a trip to London. It's made to be drunk with milk, and it shows: chocolate and caramel
    come straight through a flat white, with a little plum sweetness and almost no sharpness. With a coffee this
    forgiving, any wobbly latte art is on me.
  origins:
    - id: brazil-sul-de-minas
      label: Brazil
      place: Sul de Minas, Brazil
      note: The bag names only the country; shown for Sul de Minas, Brazil's main arabica region.
      lat: -21.55
      lon: -45.43
      precision: country
      process: Pulped natural

- id: monmouth-espresso
  name: Monmouth Espresso
  roaster: Monmouth Coffee Company
  roastedIn: { name: London, lat: 51.50, lon: -0.08 }
  flavors: [Chocolate, Roasted nuts, Soft fruit]
  take: >-
    A London classic, and the bag I'd hand to anyone starting out with espresso. A Brazilian base gives it body;
    washed Guatemalan and Colombian coffees add sweetness and a bit of lift. Round, hard to get wrong, and happy
    with or without milk.
  source: https://www.monmouthcoffee.co.uk/our-coffees
  origins:
    - id: brazil-carmo-de-minas
      label: Brazil (base of the blend)
      place: Carmo de Minas, Minas Gerais, Brazil
      note: A blend of Brazil, Guatemala and Colombia; the farms rotate through the year. Shown for the Brazilian base.
      lat: -22.12
      lon: -45.13
      precision: region
      process: Pulped natural

- id: winter-espresso
  name: Winter Espresso
  roaster: Square Mile Coffee Roasters
  source: https://shop.squaremilecoffee.com/collections/espresso-coffee
  roastedIn: { name: London, lat: 51.52, lon: -0.10 }
  roastDate: 2026-11-05
  flavors: [Blood orange, Date, Pistachio]
  take: >-
    From Square Mile, a name that carries real weight in London coffee, in a bag with a robin family baking on the
    label. Half honey-processed Ethiopian, half Guatemalan, so it's brighter than most espresso blends: citrus up
    front, a sticky dried-fruit middle, a nutty finish. Tastes like December.
  origins:
    - id: ethiopia-telila
      label: Telila, Ethiopia · 50%
      place: Kecho Anderacha, Jimma, Ethiopia
      lat: 7.77
      lon: 36.37
      precision: region
      process: Honey
    - id: guatemala-el-anonal
      label: El Anonal, Guatemala · 50%
      place: La Libertad, Huehuetenango, Guatemala
      lat: 15.51
      lon: -91.87
      precision: region

- id: red-brick
  name: Red Brick
  roaster: Square Mile Coffee Roasters
  roastedIn: { name: London, lat: 51.52, lon: -0.10 }
  roastDate: 2026-11-05
  flavors: [Yellow plum, Butterscotch, Orange, Smooth]
  take: >-
    Square Mile's house espresso, and the sweet, easy-going sibling of the Winter blend: butterscotch and soft stone
    fruit with a clean orange finish. Nothing shouts. The one I'd pull for guests.
  source: https://shop.squaremilecoffee.com/products/red-brick
  origins:
    - id: ethiopia-telila
      label: Telila, Ethiopia · 47%
      place: Kecho Anderacha, Jimma, Ethiopia
      lat: 7.77
      lon: 36.37
      precision: region
      process: Washed
    - id: costa-rica-tarrazu
      label: Don Oscar, Costa Rica · 53%
      place: Tarrazú, Costa Rica
      lat: 9.66
      lon: -84.02
      precision: region
      process: White honey

- id: nomad-guatemala-primavera
  name: Espresso Guatemala Primavera
  roaster: Nomad Coffee
  roastedIn: { name: Barcelona, lat: 41.40, lon: 2.19 }
  roastDate: 2025-09-23
  flavors: [Milk chocolate, Hazelnut, Honey]
  take: >-
    A gift from a friend, carried home from a trip to Spain. Nomad roasts it lighter than most espresso, and it shows:
    milk chocolate and hazelnut first, a gentle apple-like brightness, then honey and raisin that linger. Juicy on its
    own, soft and sweet under milk. A taste of someone else's holiday.
  source: https://www.nomadcoffee.es/
  origins:
    - id: guatemala-huehuetenango
      label: Huehuetenango, Guatemala
      place: Huehuetenango, Guatemala
      note: From local producers; Caturra, Catuai and Bourbon. Shown for the department, not a farm.
      lat: 15.32
      lon: -91.47
      precision: region
      process: Washed

- id: black-cat-classic
  name: Black Cat Classic Espresso
  roaster: Intelligentsia
  roastedIn: { name: Chicago, lat: 41.88, lon: -87.65 }
  flavors: [Dark chocolate, Caramel, Cherry]
  take: >-
    My reference point for what a classic espresso tastes like. Syrupy and sweet, chocolate and caramel first with
    a little cherry behind them, and sturdy enough that milk doesn't bury it.
  source: https://www.intelligentsia.com/products/black-cat-classic-espresso
  origins:
    - id: brazil-carmo-de-minas
      label: Brazil
      place: Carmo de Minas, Minas Gerais, Brazil
      note: Intelligentsia notes the blend's components change through the year.
      lat: -22.12
      lon: -45.13
      precision: region

- id: forty-six
  name: Forty-Six
  roaster: Counter Culture Coffee
  roastedIn: { name: Durham NC, lat: 35.99, lon: -78.90 }
  flavors: [Dark chocolate, Smoky, Full-bodied]
  take: >-
    Counter Culture's darkest roast, and not a subtle one: smoke and dark chocolate with a heavy body. That's the
    point. It's the bag I reach for when the drink is mostly milk and the coffee still has to be heard.
  source: https://counterculturecoffee.com/products/12-oz-forty-six
  origins:
    - id: peru-incahuasi
      label: Incahuasi, Peru · 70%
      place: Incahuasi, Cusco, Peru
      note: The recipe rotates with the harvests. This is a recent one published by Counter Culture; the bag sticker lists the current mix.
      lat: -13.13
      lon: -73.03
      altitude: 1800
      precision: region
    - id: ethiopia-forty-six
      label: Ethiopia · 30% (two lots)
      place: Southern Ethiopia
      note: A natural and a washed lot (Hafurza and Jabanto) in the same recent recipe.
      lat: 6.2
      lon: 38.5
      altitude: 1900
      precision: country

- id: hair-bender
  name: Hair Bender
  roaster: Stumptown Coffee Roasters
  roastedIn: { name: Portland OR, lat: 45.52, lon: -122.68 }
  flavors: [Citrus, Dark chocolate, Raisin]
  take: >-
    Stumptown's flagship, and busier than most espresso blends: a citrus edge on top of dark chocolate, with a raisin
    sweetness that shows up as it cools. Good straight, better as a cortado.
  source: https://www.stumptowncoffee.com/products/hair-bender
  # Stumptown names regions, not farms: drawn as broad areas, with no climate card (a continent has no one climate)
  origins:
    - id: area-latin-america
      label: Central and South America
      place: Central and South America
      lat: 6
      lon: -78
      spread: 16
      precision: area
    - id: area-east-africa
      label: East Africa
      place: East Africa
      lat: 2
      lon: 37
      spread: 9
      precision: area
    - id: area-indonesia
      label: Indonesia
      place: Indonesia
      lat: -3
      lon: 110
      spread: 12
      precision: area

- id: nguyen-moxy
  name: Moxy
  roaster: Nguyen Coffee Supply
  roastedIn: { name: Brooklyn, lat: 40.68, lon: -73.94 }
  flavors: [Wild berries, Cherry, Honey, Chocolate]
  take: >-
    Grown in Vietnam, roasted in Brooklyn, and a reminder that Vietnam grows more than robusta. A medium roast with
    berries and cherry on top and honey and chocolate underneath. Friendly in milk, and a nice change from the usual
    Latin American base.
  source: https://www.nguyencoffeesupply.com/pages/about-us
  origins:
    - id: vietnam-central-highlands
      label: Central Highlands, Vietnam
      place: Central Highlands, Vietnam
      note: >-
        The roaster works with a fourth-generation family farm in Vietnam's Central Highlands; the farm's exact place
        isn't published, so the pin marks the region.
      lat: 12.68
      lon: 108.05
      precision: region

- id: illy-classico
  name: Classico
  roaster: illy
  roastedIn: { name: Trieste, lat: 45.65, lon: 13.78 }
  flavors: [Caramel, Orange blossom, Jasmine]
  take: >-
    The red-and-silver tin everyone knows. Nitrogen-sealed, so every can tastes the same: caramel and a little
    chocolate, a soft floral lift, no sharp edges. Never the most exciting cup, never a wrong one, and very easy
    under milk.
  source: https://www.illy.com/en-us/shop/coffee/all-coffee/8842ST.html
  originsText: A blend of 100% Arabica from several origins; illy doesn't publish the mix.
