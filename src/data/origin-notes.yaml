# Climate in brief for each bean origin (keyed by origin id in beans.yaml): what drives the weather there, and how
# that climate is usually linked to what's in the cup. General, well-known relationships only: climate and flavor,
# nothing about harvest sizes or markets. `season` drives the card's little animation.

brazil-sul-de-minas: &minas
  climate: >-
    A subtropical highland with two clear seasons. From November to March the South Atlantic Convergence Zone parks a
    band of moisture over southeast Brazil and afternoon storms arrive almost daily. Then winter turns dry, sunny and
    cool, with clear nights around 1,000 m.
  cup: >-
    That long dry winter lets coffee dry slowly in its own fruit, in the sun, which is why Brazilian naturals and pulped
    naturals tend toward chocolate, nuts and a heavy, sweet body with little sharpness.
brazil-carmo-de-minas: *minas

ethiopia-telila:
  climate: >-
    Tropical highland forest country at about 2,000 m. The rains follow the sun: as the tropical rain belt moves north
    it brings one long wet season from roughly May to September, then drier, bright months through the winter.
    Days are mild all year and nights are cool.
  cup: >-
    Cool nights at this height slow the cherries down, and slow ripening is usually credited for the floral, citrus
    character that southwest Ethiopian coffees are known for.

guatemala-huehuetenango: &huehuetenango
  climate: >-
    High, rugged country near the Mexican border. A sharp wet season runs from May to October; winters are dry.
    Warm, dry air rising from Mexico's Tehuantepec plain keeps frost away, which is why coffee can grow unusually
    high here.
  cup: >-
    High, frost-free slopes with dry winters are associated with the bright, fruity, wine-like acidity Huehuetenango
    is known for.

costa-rica-tarrazu:
  climate: >-
    Steep Pacific-facing slopes south of San José, between about 1,200 and 1,900 m. Rain comes almost every afternoon
    from May to November; then the trade winds take over and December to April is reliably dry and sunny.
  cup: >-
    Altitude gives slow-grown, dense beans with clean, bright acidity, and the dependable dry season suits
    honey processing, where the fruit's sticky layer dries on the bean and adds sweetness.

uganda-mt-elgon:
  climate: >-
    The slopes of an old volcano on the Kenya border, coffee growing from about 1,600 to 2,200 m. Near the equator
    the year has two rainy seasons, roughly March to May and August to October, with a drier spell around the turn
    of the year; nights are cool at that height.
  cup: >-
    Deep volcanic soils and altitude are usually credited for the full body, chocolate and dried-fruit sweetness
    that arabica from Mt. Elgon (sold as Bugisu) is known for.

ethiopia-forty-six:
  climate: >-
    Highlands of southern Ethiopia, roughly 1,800–2,200 m. Two rainy seasons, a long one in spring and a shorter one
    in autumn, with dry, bright spells between; days are mild and nights cool all year.
  cup: >-
    Altitude and cool nights are behind the fruit and floral notes Ethiopian lots bring; sun-dried naturals add berry
    sweetness, washed lots a cleaner, citrus brightness.

vietnam-da-lat:
  climate: >-
    A cool plateau town about 1,500 m up in the Central Highlands. The southwest monsoon brings a wet season from
    about May to October; November to April is dry, sunny and mild, with chilly nights for the tropics.
  cup: >-
    That height and the cool, dry season let arabica ripen slowly, which is usually credited for the softer
    sweetness of Da Lat coffees: chocolate, caramel and gentle fruit rather than sharp acidity.

guatemala-central-highlands: &antigua
  climate: >-
    Valleys and slopes between volcanoes, about 1,500 m up. Rain comes from May to October, often as afternoon
    storms; November to April is dry and sunny, with cool, clear nights and a wide swing between day and night.
  cup: >-
    Volcanic soils, a sharp dry season and that big day-to-night swing are usually credited for the chocolate-and-
    spice sweetness and clean acidity of coffees from Guatemala's central highlands.
guatemala-las-nubes: *antigua

colombia-huila: &southern-colombia
  climate: >-
    Steep Andean slopes close to the equator, roughly 1,500 to 2,000 m up. Two rainy seasons a year, around March to
    May and October to December, with drier spells between, so somewhere nearby is almost always harvesting. Days
    are mild and nights cool all year.
  cup: >-
    Strong equatorial sun at height and cool nights ripen the cherries slowly, which is usually credited for the
    bright, fruit-forward acidity and caramel sweetness of washed coffees from southern Colombia.
colombia-cauca: *southern-colombia
colombia-narino: *southern-colombia

ethiopia-yirgacheffe:
  climate: >-
    Steep, green highlands in southern Ethiopia, roughly 1,800 to 2,200 m up. Rain comes in two seasons, about March
    to May and September to November, with a lull in midsummer; December to February is dry and sunny, with cool
    nights.
  cup: >-
    Altitude, cool nights and many old local varieties are usually credited for the floral, citrus and tea-like
    character washed Yirgacheffe coffees are known for.
